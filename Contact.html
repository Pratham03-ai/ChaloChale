<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Footer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        footer{
            padding:70px 0;
            background:#fff;
        }

        footer h2{
            font-weight:bold;
            margin-bottom:25px;
        }

        footer p{
            font-size:20px;
            line-height:1.8;
        }

        .quick-links a{
            display:block;
            text-decoration:none;
            font-size:20px;
            margin-bottom:10px;
        }

        .social-icons a{
            display:block;
            padding-right: 50px;
            font-size:35px;
            color:#212529;
            margin-bottom:20px;
        }

        .social-icons a:hover{
            color:#0d6efd;
        }
    </style>
</head>
<body>

<footer>
    <div class="container">

        <div class="row">

            <!-- Address -->
            <div class="col-md-4">
                <h2>ITVEDANT EDUCATION PVT LTD.</h2>

                <p>
                    3rd Floor, Korem Mall,<br>
                    Near Toyota Showroom,<br>
                    Road No.22, Wagle Estate,<br>
                    Thane-West
                </p>
            </div>

            <!-- Quick Links -->
            <div class="col-md-4 text-md-center quick-links">
                <h2>Quick Links</h2>

                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Courses</a>
                <a href="#">Placements</a>
            </div>

            <!-- Social Icons -->
            <div class="col-md-4 text-md-end social-icons">
                <h2>Connect Us</h2>

                <a href="#"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-instagram"></i></a>
                <a href="#"><i class="bi bi-linkedin"></i></a>
                <a href="#"><i class="bi bi-twitter-x"></i></a>
            </div>

        </div>

    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
